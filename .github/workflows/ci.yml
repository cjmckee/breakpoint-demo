name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Typecheck and build
        run: npm run build

      # Asserts the save migration end to end. The stat consolidation changed
      # the shape of the object every save is built around, and the failure mode
      # is silent — an unmigrated save loads and reports a plausible rating that
      # is not the one the player earned.
      - name: Save migration check
        run: npm test

name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Typecheck and build
        run: npm run build

      # The invariant checks. Each guards something whose failure mode is silent,
      # which is why they gate the build rather than living in the probe suite:
      # an unmigrated save loads and reports a plausible rating that is not the
      # one the player earned; a minigame option with no score reads as a pass
      # and hands out a reward nobody played for; an unmapped tactic shot label
      # files the shot under the wrong stat.
      - name: Invariant checks
        run: npm test

name: Deploy to GitHub Pages

# One Pages site holds two builds: `main` at the root (the live game) and the
# `staging` branch at /staging/ (for trying a branch on a phone). Pages replaces the
# whole site on every deploy, so each run builds both.
#
# Pushes to `staging` reach this through staging.yml, which dispatches it on `main`:
# the github-pages environment only accepts deployments from `main`.

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - run: npm run build
        env:
          NODE_ENV: production
          VITE_MIXPANEL_TOKEN: ${{ secrets.VITE_MIXPANEL_TOKEN }}

      - name: Look for a staging branch
        id: staging
        run: |
          if git ls-remote --exit-code --heads origin staging > /dev/null; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.staging.outputs.exists == 'true'
        with:
          ref: staging
          path: staging-src

      # No Mixpanel token: staging play shouldn't count in the live game's analytics.
      - name: Build staging into /staging/
        if: steps.staging.outputs.exists == 'true'
        working-directory: staging-src
        run: |
          npm ci
          npm run build -- --outDir ../dist/staging --emptyOutDir
        env:
          NODE_ENV: production
          VITE_CHANNEL: staging

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4

name: Deploy staging

# Pushing to `staging` redeploys the Pages site, which builds this branch into /staging/.
# The deploy itself runs from `main` (see deploy.yml), so this only starts it.

on:
  push:
    branches:
      - staging

permissions:
  actions: write

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - run: gh workflow run deploy.yml --ref main --repo "$GITHUB_REPOSITORY"
        env:
          GH_TOKEN: ${{ github.token }}
